name: Tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_call: # required to pass before publishing, see publish.yml

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 22.x, 24.x, 26.x]
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7.0.0
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm ci
      env:
        CI: true
    - run: npm run test
