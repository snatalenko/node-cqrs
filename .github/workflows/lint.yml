name: Lint

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Use Node.js 24.x
      uses: actions/setup-node@v7.0.0
      with:
        node-version: 24.x
    - run: npm ci --omit=optional
      env:
        CI: true
    - run: npm run lint
