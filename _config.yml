title: node-cqrs
tagline: Building blocks for CQRS and Event Sourcing
description: TypeScript CQRS and Event Sourcing toolkit for Node.js with aggregates, sagas, projections, and pluggable infrastructure adapters.
url: https://node-cqrs.org
baseurl: ""
repository: snatalenko/node-cqrs
github_branch: master

navigation:
  resources:
    - nav: examples
    - nav: changelog
    - title: Issues
      path: issues
    - title: License
      github_view: blob
      branch: true
      path: LICENSE
    - title: Maintainer
      url: https://natalenko.com/about/

layouts_dir: .jekyll/_layouts
includes_dir: .jekyll/_includes

include:
  - README.md
  - examples/README.md
  - src/sqlite/README.md
  - src/mongodb/README.md
  - src/redis/README.md
  - src/postgresql/README.md
  - src/rabbitmq/README.md
  - src/workers/README.md

defaults:
  - scope:
      path: README.md
    values:
      layout: docs
      title: "node-cqrs: CQRS and Event Sourcing for TypeScript"
      nav: overview
      nav_title: Overview
      nav_group: primary
      nav_order: 1
      description: Build CQRS and Event Sourcing applications in TypeScript with aggregates, sagas, projections, dependency injection, and pluggable infrastructure.
      source_path: README.md
      source_url: https://github.com/snatalenko/node-cqrs/blob/master/README.md
      permalink: /
      content_start_id: features
      last_modified_at: 2026-08-14
      sitemap: true
  - scope:
      path: examples/README.md
    values:
      layout: docs
      title: Examples
      nav: examples
      nav_title: Examples
      nav_group: resources
      eyebrow: node-cqrs resources
      description: Runnable node-cqrs examples for core CQRS workflows, sagas, projections, telemetry, and infrastructure modules.
