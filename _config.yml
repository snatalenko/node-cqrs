markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-optional-front-matter
  - jekyll-sitemap

optional_front_matter:
  remove_originals: true

readme_index:
  enabled: false

exclude:
  - .github
  - .jekyll/Gemfile
  - .jekyll/Gemfile.lock
  - AGENTS.md
  - CLAUDE.md
  - CONTRIBUTING.md
  - LICENSE
  - NOTICE
  - coverage
  - dist
  - "examples/*"
  - node_modules
  - scripts
  - "src/*.ts"
  - "src/**/*.ts"
  - tests
  - eslint.config.mjs
  - jest.config.ts
  - jsconfig.json
  - package-lock.json
  - package.json
  - rollup.browser.config.mjs
  - tsconfig.cjs.json
  - tsconfig.esm.json
  - tsconfig.json
